<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short Username Checker</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px;background:#111;color:#eee}
.card{background:#1b1b1b;padding:20px;border-radius:14px;margin-bottom:16px}
label{display:block;margin:10px 0 6px}select,input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff}
button{cursor:pointer;margin:6px 6px 0 0}#status{font-weight:700}.ok{color:#5ee37b}.warn{color:#ffd166}.bad{color:#ff6b6b}
#results{max-height:360px;overflow:auto;font-family:monospace;white-space:pre-wrap}
.small{opacity:.75;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
<h1>Short Username Checker</h1>
<p>Generates 3- or 4-character Roblox usernames and checks them one at a time.</p>
<p id="connection" class="warn">Connecting to Render server…</p>
</div>
<div class="card">
<label>Platform</label>
<select id="platform"><option value="roblox">Roblox</option></select>
<label>Username length</label>
<select id="length"><option value="3">3</option><option value="4">4</option></select>
<label>Characters</label>
<select id="chars"><option value="letters">Letters only</option><option value="alnum">Letters + numbers</option></select>
<label>Delay between checks (ms)</label>
<input id="delay" type="number" min="2000" step="500" value="2000">
<br>
<button id="start">Start</button><button id="stop" disabled>Stop</button><button id="clear">Clear</button>
<p id="status">Ready.</p>
</div>
<div class="card">
<h2>Results</h2>
<div id="results"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let running=false, checked=new Set();
const letters="abcdefghijklmnopqrstuvwxyz", alnum=letters+"0123456789";

function log(s){$("results").textContent += s+"\n"; $("results").scrollTop=$("results").scrollHeight;}
function randomName(n,set){let s=""; for(let i=0;i<n;i++) s+=set[Math.floor(Math.random()*set.length)]; return s;}

async function checkServer(){
  try{
    const r=await fetch("/api/check?username=Test_"+Math.floor(Math.random()*999999),{cache:"no-store"});
    if(r.status===429) return {ok:false,rate:true};
    if(!r.ok) return {ok:false};
    const d=await r.json();
    return {ok:true};
  }catch(e){return {ok:false};}
}
(async()=>{
  const r=await checkServer();
  if(r.ok){$("connection").textContent="✓ Connected to the Render server";$("connection").className="ok";}
  else if(r.rate){$("connection").textContent="⚠ Render is connected, but Roblox is rate-limiting requests right now";$("connection").className="warn";}
  else {$("connection").textContent="✕ Could not reach the Render checking endpoint";$("connection").className="bad";}
})();

async function robloxCheck(name){
  try{
    const r=await fetch("/api/check?username="+encodeURIComponent(name),{cache:"no-store"});
    let d={}; try{d=await r.json()}catch{}
    if(r.status===429 || d.rateLimited) return {rateLimited:true};
    if(!r.ok) return {error:d.error||("HTTP "+r.status)};
    return {available:d.available===true, code:d.code};
  }catch(e){return {error:"Could not reach the Render server"};}
}

$("start").onclick=async()=>{
  if(running)return;
  running=true;$("start").disabled=true;$("stop").disabled=false;
  const n=Number($("length").value), set=$("chars").value==="letters"?letters:alnum;
  const delay=Math.max(2000,Number($("delay").value)||2000);
  $("status").textContent="Checking…";
  while(running){
    let name=randomName(n,set);
    if(checked.has(name)) continue;
    checked.add(name);
    const res=await robloxCheck(name);
    if(res.rateLimited){
      log("RATE LIMITED — stopped safely. Wait and try again later.");
      $("status").textContent="Stopped: Roblox rate-limited the checker.";
      running=false;break;
    }
    if(res.error){
      log("ERROR "+name+" — "+res.error);
      $("status").textContent="Stopped: server/request error.";
      running=false;break;
    }
    if(res.available){
      log("✓ AVAILABLE: "+name);
      $("status").textContent="Available username found: "+name;
      try{new AudioContext().resume().then(()=>{const a=new AudioContext();const o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.25)})}catch{}
      running=false;break;
    }else log("✗ TAKEN: "+name);
    await new Promise(r=>setTimeout(r,delay));
  }
  $("start").disabled=false;$("stop").disabled=true;
};
$("stop").onclick=()=>{running=false;$("status").textContent="Stopped.";};
$("clear").onclick=()=>{$("results").textContent="";checked.clear();$("status").textContent="Ready.";};
</script>
</body>
</html>
